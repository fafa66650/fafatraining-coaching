<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8ff18"><title>FAFATRAINING — actualisation</title><style>html,body{margin:0;min-height:100%;background:#050705;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:12vh auto;padding:28px}section{border:1px solid #b8ff18;border-radius:24px;padding:26px;background:#0d110d}h1{color:#b8ff18}p{line-height:1.55;color:#dbe4d9}</style></head><body><main><section><h1>FAFATRAINING</h1><p>Actualisation de l’application en cours… Tes adhérents, séances et préférences enregistrés localement ne sont pas supprimés.</p></section></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(e){}location.replace('./?cachefix='+Date.now())})()</script></body></html>
