<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050605">
  <meta name="description" content="FAFATRAINING — séances, programmes, cours collectifs, mouvements et suivi coach.">
  <title>FAFATRAINING — Ultimate Coach Studio V85</title>
  <link rel="manifest" href="./manifest.json?v=85">
  <link rel="icon" href="./assets/logo/logo-fafatraining.jpg">
  <link rel="stylesheet" href="./styles/fafatraining-v85.css?v=85">
  <script>
  // V85: neutralise les anciens caches/service workers des versions précédentes.
  (function(){
    try{
      if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
      if('caches' in window){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});}
    }catch(e){}
    window.addEventListener('error',function(ev){
      var root=document.getElementById('app');
      if(!root || document.documentElement.dataset.appReady==='1') return;
      root.innerHTML='<main class="boot-screen"><div><img src="./assets/logo/logo-fafatraining.jpg"><h1>FAFATRAINING</h1><p>Le chargement a rencontré une erreur JavaScript : '+String(ev.message||'erreur inconnue')+'</p><button onclick="location.reload()" class="primary">Réessayer</button></div></main>';
    });
    setTimeout(function(){
      if(document.documentElement.dataset.appReady==='1') return;
      var root=document.getElementById('app');
      if(root) root.innerHTML='<main class="boot-screen"><div><img src="./assets/logo/logo-fafatraining.jpg"><h1>FAFATRAINING</h1><p>Le moteur n’a pas terminé son démarrage. Recharge la page. Si ce message reste affiché, la page indique désormais le problème au lieu de rester noire.</p><button onclick="location.reload()" class="primary">Recharger</button></div></main>';
    },8000);
  })();
  </script>
</head>
<body>
  <div id="app">
    <main id="boot-loading" class="boot-screen"><div><img src="./assets/logo/logo-fafatraining.jpg"><h1>FAFATRAINING</h1><p>Chargement de l’Ultimate Coach Studio…</p></div></main>
  </div>
  <noscript><main class="boot-screen"><div><h1>FAFATRAINING</h1><p>JavaScript doit être activé pour utiliser l’application.</p></div></main></noscript>
  <script src="./src/fafatraining-v85.js?v=85"></script>
</body>
</html>
